<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 560" width="1660" height="560" font-family="Segoe UI,Arial"><rect x="0" y="0" width="1660" height="560" fill="#FFFFFF"/><text x="40" y="48" font-size="24" fill="#1F3A5F" font-weight="bold" font-family="Segoe UI,Arial">Onde traçar cada Evento Pivotal</text><text x="40" y="72" font-size="12.5" fill="#5A7184" font-family="Segoe UI,Arial">O pivotal e o ULTIMO card (evento, em laranja) de cada ciclo. A linha vertical vem logo depois dele e separa a proxima fase.</text><rect x="40" y="150" width="210" height="300" rx="10" fill="#EEF3F7" stroke="#C7D2DC"/><rect x="40" y="150" width="210" height="30" rx="10" fill="#1F3A5F"/><rect x="40" y="168" width="210" height="12" fill="#1F3A5F"/><text x="145.0" y="170" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial">FASE 1</text><text x="145.0" y="296.0" font-size="13" fill="#1F3A5F" text-anchor="middle" font-family="Segoe UI,Arial">Identificacao</text><text x="145.0" y="410" font-size="10.5" fill="#5A7184" text-anchor="middle" font-style="italic" font-family="Segoe UI,Arial">ciclo termina em &#8594;</text><line x1="296.0" y1="110" x2="296.0" y2="480" stroke="#1F3A5F" stroke-width="3"/><circle cx="296.0" cy="300.0" r="8" fill="#1F3A5F"/><text x="296.0" y="100" font-size="12" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial">PIVOTAL 1</text><rect x="211.0" y="267.0" width="170" height="66" rx="8" fill="#F6A93B" stroke="#00000026"/><text x="296.0" y="296" font-size="12" fill="#5A3A00" text-anchor="middle" font-family="Segoe UI,Arial">Cliente e veiculo</text><text x="296.0" y="311" font-size="12" fill="#5A3A00" text-anchor="middle" font-family="Segoe UI,Arial">identificados</text><rect x="342" y="150" width="210" height="300" rx="10" fill="#EEF3F7" stroke="#C7D2DC"/><rect x="342" y="150" width="210" height="30" rx="10" fill="#1F3A5F"/><rect x="342" y="168" width="210" height="12" fill="#1F3A5F"/><text x="447.0" y="170" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial">FASE 2</text><text x="447.0" y="296.0" font-size="13" fill="#1F3A5F" text-anchor="middle" font-family="Segoe UI,Arial">Criacao da</text><text x="447.0" y="314.0" font-size="13" fill="#1F3A5F" text-anchor="middle" font-family="Segoe UI,Arial">OS e Diagnostico</text><text x="447.0" y="410" font-size="10.5" fill="#5A7184" text-anchor="middle" font-style="italic" font-family="Segoe UI,Arial">ciclo termina em &#8594;</text><line x1="598.0" y1="110" x2="598.0" y2="480" stroke="#1F3A5F" stroke-width="3"/><circle cx="598.0" cy="300.0" r="8" fill="#1F3A5F"/><text x="598.0" y="100" font-size="12" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial">PIVOTAL 2</text><rect x="513.0" y="267.0" width="170" height="66" rx="8" fill="#F6A93B" stroke="#00000026"/><text x="598.0" y="296" font-size="12" fill="#5A3A00" text-anchor="middle" font-family="Segoe UI,Arial">Diagnostico</text><text x="598.0" y="311" font-size="12" fill="#5A3A00" text-anchor="middle" font-family="Segoe UI,Arial">finalizado</text><rect x="644" y="150" width="210" height="300" rx="10" fill="#EEF3F7" stroke="#C7D2DC"/><rect x="644" y="150" width="210" height="30" rx="10" fill="#1F3A5F"/><rect x="644" y="168" width="210" height="12" fill="#1F3A5F"/><text x="749.0" y="170" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial">FASE 3</text><text x="749.0" y="296.0" font-size="13" fill="#1F3A5F" text-anchor="middle" font-family="Segoe UI,Arial">Orcamento e</text><text x="749.0" y="314.0" font-size="13" fill="#1F3A5F" text-anchor="middle" font-family="Segoe UI,Arial">Aprovacao</text><text x="749.0" y="410" font-size="10.5" fill="#5A7184" text-anchor="middle" font-style="italic" font-family="Segoe UI,Arial">ciclo termina em &#8594;</text><line x1="900.0" y1="110" x2="900.0" y2="480" stroke="#1F3A5F" stroke-width="3"/><circle cx="900.0" cy="300.0" r="8" fill="#1F3A5F"/><text x="900.0" y="100" font-size="12" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial">PIVOTAL 3</text><rect x="815.0" y="267.0" width="170" height="66" rx="8" fill="#F6A93B" stroke="#00000026"/><text x="900.0" y="296" font-size="12" fill="#5A3A00" text-anchor="middle" font-family="Segoe UI,Arial">OS aprovada pelo</text><text x="900.0" y="311" font-size="12" fill="#5A3A00" text-anchor="middle" font-family="Segoe UI,Arial">cliente</text><rect x="946" y="150" width="210" height="300" rx="10" fill="#EEF3F7" stroke="#C7D2DC"/><rect x="946" y="150" width="210" height="30" rx="10" fill="#1F3A5F"/><rect x="946" y="168" width="210" height="12" fill="#1F3A5F"/><text x="1051.0" y="170" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial">FASE 4</text><text x="1051.0" y="296.0" font-size="13" fill="#1F3A5F" text-anchor="middle" font-family="Segoe UI,Arial">Execucao</text><text x="1051.0" y="410" font-size="10.5" fill="#5A7184" text-anchor="middle" font-style="italic" font-family="Segoe UI,Arial">ciclo termina em &#8594;</text><line x1="1202.0" y1="110" x2="1202.0" y2="480" stroke="#1F3A5F" stroke-width="3"/><circle cx="1202.0" cy="300.0" r="8" fill="#1F3A5F"/><text x="1202.0" y="100" font-size="12" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial">PIVOTAL 4</text><rect x="1117.0" y="267.0" width="170" height="66" rx="8" fill="#F6A93B" stroke="#00000026"/><text x="1202.0" y="304" font-size="12" fill="#5A3A00" text-anchor="middle" font-family="Segoe UI,Arial">OS finalizada</text><rect x="1248" y="150" width="210" height="300" rx="10" fill="#EEF3F7" stroke="#C7D2DC"/><rect x="1248" y="150" width="210" height="30" rx="10" fill="#1F3A5F"/><rect x="1248" y="168" width="210" height="12" fill="#1F3A5F"/><text x="1353.0" y="170" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial">FASE 5</text><text x="1353.0" y="296.0" font-size="13" fill="#1F3A5F" text-anchor="middle" font-family="Segoe UI,Arial">Entrega</text><text x="1353.0" y="410" font-size="10.5" fill="#5A7184" text-anchor="middle" font-style="italic" font-family="Segoe UI,Arial">ciclo termina em &#8594;</text><line x1="1504.0" y1="110" x2="1504.0" y2="480" stroke="#1F3A5F" stroke-width="3"/><circle cx="1504.0" cy="300.0" r="8" fill="#1F3A5F"/><text x="1504.0" y="100" font-size="12" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial">PIVOTAL 5</text><rect x="1419.0" y="267.0" width="170" height="66" rx="8" fill="#F6A93B" stroke="#00000026"/><text x="1504.0" y="304" font-size="12" fill="#5A3A00" text-anchor="middle" font-family="Segoe UI,Arial">OS entregue (fim)</text><rect x="40" y="520" width="20" height="16" rx="3" fill="#F6A93B" stroke="#00000026"/><text x="68" y="533" font-size="12" fill="#1F3A5F" font-family="Segoe UI,Arial">Evento pivotal = ultimo card (evento) do ciclo. A linha vertical fica imediatamente apos esse card.</text><text x="40" y="560" font-size="11.5" fill="#5A7184" font-family="Segoe UI,Arial">Regra: o pivotal pertence ao FIM da fase anterior (nao ao inicio da proxima). Ex.: "Diagnostico finalizado" fecha a Fase 2; a Fase 3 comeca depois da linha.</text></svg>