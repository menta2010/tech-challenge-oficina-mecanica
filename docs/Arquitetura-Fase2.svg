<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="874" viewBox="0 0 1500 874" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1500" height="874" fill="#ffffff"/>
  <text x="750" y="44" font-size="27" font-weight="700" text-anchor="middle" fill="#0f172a">Oficina Mecanica - Arquitetura da Solucao (Fase 2)</text>
  <text x="750" y="72" font-size="15" text-anchor="middle" fill="#64748b">.NET 8 | Clean Architecture | Kubernetes | Terraform | GitHub Actions</text>

  <!-- ============ 1. COMPONENTES DA APLICACAO ============ -->
  <rect x="30" y="98" width="700" height="470" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="50" y="126" font-size="17" font-weight="700" fill="#0f172a">1. Componentes da Aplicacao (Clean Architecture)</text>

  <rect x="55" y="146" width="300" height="52" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="205" y="167" font-size="14" font-weight="700" text-anchor="middle" fill="#075985">Oficina.API</text>
  <text x="205" y="186" font-size="12" text-anchor="middle" fill="#0c4a6e">Controllers REST, Swagger, JWT, middleware</text>

  <rect x="405" y="146" width="300" height="52" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="555" y="167" font-size="14" font-weight="700" text-anchor="middle" fill="#713f12">Clientes externos</text>
  <text x="555" y="186" font-size="12" text-anchor="middle" fill="#713f12">Front-end / Webhook de orcamento</text>

  <rect x="55" y="222" width="300" height="52" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="243" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">Oficina.Application</text>
  <text x="205" y="262" font-size="12" text-anchor="middle" fill="#14532d">Casos de uso, DTOs, PORTAS (interfaces)</text>

  <rect x="55" y="298" width="300" height="52" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="205" y="319" font-size="14" font-weight="700" text-anchor="middle" fill="#4c1d95">Oficina.Domain</text>
  <text x="205" y="338" font-size="12" text-anchor="middle" fill="#4c1d95">Agregado OrdemServico, Value Objects</text>

  <rect x="405" y="222" width="300" height="128" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="555" y="245" font-size="14" font-weight="700" text-anchor="middle" fill="#881337">Oficina.Infrastructure</text>
  <text x="555" y="266" font-size="12" text-anchor="middle" fill="#881337">ADAPTADORES: EF Core / Npgsql</text>
  <text x="555" y="285" font-size="12" text-anchor="middle" fill="#881337">Repositorios, UnitOfWork, JWT</text>
  <text x="555" y="304" font-size="12" text-anchor="middle" fill="#881337">EmailNotificadorLog (notificacao)</text>
  <text x="555" y="330" font-size="11" font-style="italic" text-anchor="middle" fill="#9f1239">implementa as portas da Application</text>

  <line x1="405" y1="172" x2="360" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="205" y1="198" x2="205" y2="218" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="205" y1="274" x2="205" y2="294" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="405" y1="262" x2="360" y2="250" stroke="#e11d48" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#r)"/>

  <rect x="55" y="374" width="650" height="76" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="396" font-size="13" font-weight="700" fill="#0f172a">APIs da Fase 2</text>
  <text x="70" y="416" font-size="12" fill="#334155">POST /api/ordens-servico (abertura com servicos e pecas)  |  GET /api/acompanhamento/{id} (status)</text>
  <text x="70" y="435" font-size="12" fill="#334155">GET /api/ordens-servico (ordenada + exclusao logica)  |  POST /{id}/orcamento/resposta (webhook)</text>

  <rect x="55" y="470" width="650" height="80" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="70" y="492" font-size="13" font-weight="700" fill="#164e63">Regra de listagem (ordenacao)</text>
  <text x="70" y="512" font-size="12" fill="#155e75">Em Execucao &gt; Aguardando Aprovacao &gt; Diagnostico &gt; Recebida | mais antigas primeiro</text>
  <text x="70" y="531" font-size="12" fill="#155e75">Finalizada / Entregue / Cancelada: excluidas logicamente da listagem operacional</text>

  <!-- ============ 2. INFRAESTRUTURA ============ -->
  <rect x="760" y="98" width="710" height="470" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="780" y="126" font-size="17" font-weight="700" fill="#0f172a">2. Infraestrutura Provisionada (Terraform + Kubernetes)</text>

  <rect x="782" y="142" width="300" height="80" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="932" y="164" font-size="14" font-weight="700" text-anchor="middle" fill="#4c1d95">Terraform (infra/)</text>
  <text x="932" y="184" font-size="12" text-anchor="middle" fill="#5b21b6">kind_cluster + namespace</text>
  <text x="932" y="203" font-size="12" text-anchor="middle" fill="#5b21b6">PostgreSQL: Deployment/Service/PVC/Secret</text>

  <rect x="782" y="244" width="666" height="304" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="800" y="268" font-size="14" font-weight="700" fill="#1e3a8a">Cluster Kubernetes - namespace oficina</text>

  <rect x="802" y="284" width="300" height="104" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="952" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#1e40af">Deployment oficina-api</text>
  <text x="952" y="326" font-size="12" text-anchor="middle" fill="#1e3a8a">2 a 5 replicas (imagem chiseled, non-root)</text>
  <text x="952" y="345" font-size="12" text-anchor="middle" fill="#1e3a8a">probes readiness/liveness em /health</text>
  <text x="952" y="371" font-size="12" text-anchor="middle" fill="#1e3a8a">Service NodePort 30080</text>

  <rect x="1128" y="284" width="300" height="104" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1278" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#78350f">HPA</text>
  <text x="1278" y="326" font-size="12" text-anchor="middle" fill="#78350f">CPU 70% / memoria 80%</text>
  <text x="1278" y="345" font-size="12" text-anchor="middle" fill="#78350f">min 2 - max 5 pods</text>
  <text x="1278" y="371" font-size="12" text-anchor="middle" fill="#78350f">escalabilidade automatica</text>

  <rect x="802" y="406" width="300" height="80" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="952" y="428" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">PostgreSQL 16</text>
  <text x="952" y="448" font-size="12" text-anchor="middle" fill="#14532d">Deployment + Service ClusterIP</text>
  <text x="952" y="467" font-size="12" text-anchor="middle" fill="#14532d">PersistentVolumeClaim 1Gi</text>

  <rect x="1128" y="406" width="300" height="80" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1278" y="428" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">ConfigMap + Secrets</text>
  <text x="1278" y="448" font-size="12" text-anchor="middle" fill="#7f1d1d">conn string, chave JWT</text>
  <text x="1278" y="467" font-size="12" text-anchor="middle" fill="#7f1d1d">token do webhook externo</text>

  <line x1="952" y1="388" x2="952" y2="402" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1128" y1="336" x2="1106" y2="336" stroke="#d97706" stroke-width="2" marker-end="url(#o)"/>
  <line x1="1128" y1="446" x2="1106" y2="360" stroke="#dc2626" stroke-width="2" marker-end="url(#d)"/>
  <line x1="932" y1="222" x2="932" y2="240" stroke="#7c3aed" stroke-width="2" marker-end="url(#p)"/>
  <text x="1200" y="516" font-size="11" text-anchor="middle" fill="#475569">Secrets injetam variaveis sensiveis nos pods da API</text>

  <!-- ============ 3. FLUXO DE DEPLOY ============ -->
  <rect x="30" y="588" width="1440" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="50" y="616" font-size="17" font-weight="700" fill="#0f172a">3. Fluxo de Deploy (CI/CD - GitHub Actions)</text>

  <rect x="52" y="634" width="182" height="66" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="143" y="662" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Push na branch</text>
  <text x="143" y="682" font-size="12" text-anchor="middle" fill="#334155">repositorio GitHub</text>

  <rect x="266" y="634" width="182" height="66" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="357" y="662" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">Build</text>
  <text x="357" y="682" font-size="12" text-anchor="middle" fill="#1e40af">dotnet restore/build</text>

  <rect x="480" y="634" width="182" height="66" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="571" y="662" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">Testes</text>
  <text x="571" y="682" font-size="12" text-anchor="middle" fill="#14532d">unitarios + integracao</text>

  <rect x="694" y="634" width="182" height="66" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="785" y="662" font-size="13" font-weight="700" text-anchor="middle" fill="#713f12">Imagem Docker</text>
  <text x="785" y="682" font-size="12" text-anchor="middle" fill="#713f12">push para GHCR</text>

  <rect x="908" y="634" width="182" height="66" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="999" y="662" font-size="13" font-weight="700" text-anchor="middle" fill="#4c1d95">Deploy K8s</text>
  <text x="999" y="682" font-size="12" text-anchor="middle" fill="#5b21b6">kubectl apply -f k8s/</text>

  <rect x="1122" y="634" width="182" height="66" rx="7" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="1213" y="662" font-size="13" font-weight="700" text-anchor="middle" fill="#164e63">Banco + API</text>
  <text x="1213" y="682" font-size="12" text-anchor="middle" fill="#155e75">rollout status</text>

  <rect x="1336" y="634" width="112" height="66" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1392" y="662" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">Smoke</text>
  <text x="1392" y="682" font-size="12" text-anchor="middle" fill="#14532d">/health</text>

  <line x1="234" y1="667" x2="262" y2="667" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="448" y1="667" x2="476" y2="667" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="662" y1="667" x2="690" y2="667" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="876" y1="667" x2="904" y2="667" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1090" y1="667" x2="1118" y2="667" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1304" y1="667" x2="1332" y2="667" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="750" y="736" font-size="12" text-anchor="middle" fill="#475569">A infraestrutura base (cluster Kubernetes + banco de dados) e provisionada previamente com Terraform (terraform apply)</text>
  <text x="750" y="756" font-size="12" text-anchor="middle" fill="#475569">O pipeline aplica os manifestos de /k8s, publicando banco e aplicacao, e valida a saude do ambiente</text>

  <!-- legenda -->
  <rect x="30" y="788" width="1440" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="812" font-size="12" font-weight="700" fill="#0f172a">Principios:</text>
  <text x="130" y="812" font-size="12" fill="#334155">dependencias apontam para dentro (API -&gt; Application -&gt; Domain); a Infrastructure implementa as portas definidas na Application.</text>
  <text x="50" y="836" font-size="12" font-weight="700" fill="#0f172a">Seguranca:</text>
  <text x="130" y="836" font-size="12" fill="#334155">imagem chiseled non-root, JWT nas rotas administrativas, token de servico no webhook, segredos via Secret do Kubernetes.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e11d48"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#d97706"/></marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker>
    <marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
