# Credenciais do banco. Em producao, gere via `kubectl create secret` ou um cofre (Vault/SealedSecrets).
# NAO versione segredos reais: estes valores sao apenas para o ambiente de avaliacao.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-postgres-secret
  namespace: oficina
type: Opaque
stringData:
  POSTGRES_DB: oficina
  POSTGRES_USER: oficina
  POSTGRES_PASSWORD: oficina-db-pass-CHANGE-ME
