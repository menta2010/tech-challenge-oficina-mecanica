# Segredos da API: connection string (com senha), chave JWT, token do webhook e senha do admin seed.
# Em producao, injete via cofre/SealedSecrets. Valores abaixo sao apenas para avaliacao.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secret
  namespace: oficina
type: Opaque
stringData:
  ConnectionStrings__Default: "Host=oficina-postgres;Port=5432;Database=oficina;Username=oficina;Password=oficina-db-pass-CHANGE-ME"
  Jwt__SecretKey: "CHANGE-ME-super-secret-key-with-at-least-32-chars"
  ExternalApproval__Token: "webhook-token-CHANGE-ME"
  SEED_ADMIN_PASSWORD: "admin123"
