name: CI/CD

# PR: build, testes (unitarios + integracao com PostgreSQL real), imagem e scan de vulnerabilidades.
# develop -> deploy em homolog | master -> deploy em prod (EKS), com migrations e smoke test ponta a ponta.
on:
  pull_request:
    branches: [ develop, master ]
  push:
    branches: [ develop, master ]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Integracao usa Testcontainers (PostgreSQL 16 real no Docker do runner)
      - name: Test (com cobertura)
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage

  image-scan:
    name: Docker image + Trivy
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t oficina-api:${{ github.sha }} .

      - name: Trivy (vulnerabilidades da imagem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: oficina-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          exit-code: '0'

      - name: Upload relatorio Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  deploy:
    name: Deploy EKS (${{ github.ref_name == 'master' && 'prod' || 'homolog' }})
    needs: [ build-test, image-scan ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'homolog' }}
    env:
      AMBIENTE: ${{ github.ref_name == 'master' && 'prod' || 'homolog' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descobrir recursos do ambiente (criados pelos repositorios de infra)
        run: |
          ECR=$(aws ecr describe-repositories --repository-names "oficina-${AMBIENTE}-api" --query 'repositories[0].repositoryUri' --output text)
          SNS=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':oficina-${AMBIENTE}-notificacoes-os')].TopicArn | [0]" --output text)
          API=$(aws apigatewayv2 get-apis --query "Items[?Name=='oficina-${AMBIENTE}-api'].ApiEndpoint | [0]" --output text)
          VERSAO=$(echo "${GITHUB_SHA}" | cut -c1-7)
          {
            echo "ECR=${ECR}"
            echo "SNS_TOPIC_ARN=${SNS}"
            echo "API_URL=${API}"
            echo "VERSAO=${VERSAO}"
            echo "IMAGEM=${ECR}:${VERSAO}"
          } >> "$GITHUB_ENV"

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        run: |
          docker build -t "${IMAGEM}" -t "${ECR}:${AMBIENTE}-latest" .
          docker push "${IMAGEM}"
          docker push "${ECR}:${AMBIENTE}-latest"

      - name: kubeconfig
        run: aws eks update-kubeconfig --name "oficina-${AMBIENTE}-eks" --region "${AWS_REGION}"

      - name: Secret da aplicacao (a partir do Secrets Manager)
        run: |
          DB=$(aws secretsmanager get-secret-value --secret-id "oficina/${AMBIENTE}/db" --query SecretString --output text)
          JWT=$(aws secretsmanager get-secret-value --secret-id "oficina/${AMBIENTE}/jwt" --query SecretString --output text)
          WEBHOOK=$(aws secretsmanager get-secret-value --secret-id "oficina/${AMBIENTE}/webhook" --query SecretString --output text)
          CONN="Host=$(jq -r .host <<<"$DB");Port=$(jq -r .port <<<"$DB");Database=$(jq -r .dbname <<<"$DB");Username=$(jq -r .username <<<"$DB");Password=$(jq -r .password <<<"$DB");SSL Mode=Require"

          kubectl apply -f k8s/00-namespace.yaml
          kubectl -n oficina create secret generic oficina-api-secret \
            --from-literal=ConnectionStrings__Default="${CONN}" \
            --from-literal=Jwt__SecretKey="${JWT}" \
            --from-literal=ExternalApproval__Token="${WEBHOOK}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --from-literal=SEED_ADMIN_PASSWORD="${{ secrets.SEED_ADMIN_PASSWORD }}" \
            --from-literal=SEED_ATENDENTE_PASSWORD="${{ secrets.SEED_ATENDENTE_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Migrations (Job) antes do deploy
        run: |
          VARS='${IMAGEM} ${VERSAO} ${AMBIENTE} ${SNS_TOPIC_ARN} ${AWS_REGION}'
          envsubst "$VARS" < k8s/01-configmap.yaml | kubectl apply -f -
          envsubst "$VARS" < k8s/02-migracao-job.yaml | kubectl apply -f -
          if ! kubectl -n oficina wait --for=condition=complete "job/oficina-migracao-${VERSAO}" --timeout=300s; then
            kubectl -n oficina logs "job/oficina-migracao-${VERSAO}" --tail=100 || true
            exit 1
          fi

      - name: Deploy da API (rolling update sem indisponibilidade)
        run: |
          VARS='${IMAGEM} ${VERSAO} ${AMBIENTE} ${SNS_TOPIC_ARN} ${AWS_REGION}'
          for f in k8s/03-deployment.yaml k8s/04-service.yaml k8s/05-hpa.yaml; do
            envsubst "$VARS" < "$f" | kubectl apply -f -
          done
          kubectl -n oficina rollout status deploy/oficina-api --timeout=300s
          kubectl -n oficina get pods,svc,hpa -o wide

      - name: Smoke test ponta a ponta (API Gateway -> Lambda -> EKS -> RDS)
        run: |
          set -e
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/health/ready") && [ "$status" = "200" ] && break
            echo "Aguardando o NLB registrar os nos (${i}/12, status ${status})"; sleep 10
          done
          test "$status" = "200"

          TOKEN=$(curl -sf -X POST "${API_URL}/auth/login" -H "Content-Type: application/json" \
            -H "x-correlation-id: smoke-${VERSAO}" \
            -d "{\"usuario\":\"admin\",\"senha\":\"${{ secrets.SEED_ADMIN_PASSWORD }}\"}" | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != "null"

          status=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/api/lojas" -H "Authorization: Bearer ${TOKEN}")
          test "$status" = "200"
          echo "Deploy ${VERSAO} validado em ${API_URL} (Swagger: ${API_URL}/swagger)"

      - name: Diagnostico em caso de falha
        if: failure()
        run: |
          kubectl -n oficina get pods,svc,hpa,jobs || true
          kubectl -n oficina describe pods -l app=oficina-api || true
          kubectl -n oficina logs deploy/oficina-api --tail=100 || true
