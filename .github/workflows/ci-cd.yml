name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DOTNET_VERSION: '8.0.x'

jobs:
  # 1) Build + testes (unitarios e de integracao com Testcontainers)
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (com cobertura)
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage

  # 2) Validacao estatica da infraestrutura como codigo
  infra-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.0'

      - name: Terraform format
        working-directory: infra
        run: terraform fmt -check

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

  # 3) Build da imagem Docker e push para o GitHub Container Registry (GHCR)
  docker-image:
    name: Docker image
    needs: [build-test, infra-validate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 4) Deploy em Kubernetes (cluster kind efemero no runner) + banco + aplicacao dos manifestos
  deploy-k8s:
    name: Deploy to Kubernetes
    needs: docker-image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: oficina

      - name: Install metrics-server for HPA
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
          if ! kubectl -n kube-system get deploy metrics-server \
            -o jsonpath='{.spec.template.spec.containers[0].args}' | grep -q -- '--kubelet-insecure-tls'; then
            kubectl -n kube-system patch deployment metrics-server --type=json \
              -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          fi
          kubectl -n kube-system rollout status deploy/metrics-server --timeout=180s

      - name: Build image and load into kind
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest .
          kind load docker-image ghcr.io/${{ github.repository }}:latest --name oficina

      - name: Apply manifests (namespace, banco, API, HPA)
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        run: |
          kubectl -n oficina rollout status deploy/oficina-postgres --timeout=180s
          kubectl -n oficina rollout status deploy/oficina-api --timeout=180s

      - name: Verify metrics and HPA
        run: |
          for attempt in {1..12}; do
            if kubectl top pods -n oficina; then
              kubectl -n oficina get hpa oficina-api-hpa
              exit 0
            fi
            echo "Aguardando metricas (${attempt}/12)..."
            sleep 5
          done
          echo "Metrics Server nao disponibilizou metricas dentro do prazo."
          exit 1

      - name: Smoke test (/health/ready)
        run: |
          kubectl -n oficina port-forward svc/oficina-api 8080:80 &
          sleep 8
          http_status=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            --output /tmp/health-body --write-out "%{http_code}" \
            http://localhost:8080/health/ready)
          health_body=$(tr -d '\r\n' < /tmp/health-body)
          test "$http_status" = "200"
          test "$health_body" = "Healthy"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n oficina get pods,svc,hpa || true
          kubectl -n oficina describe pods || true
          kubectl -n oficina logs deploy/oficina-api --tail=100 || true
